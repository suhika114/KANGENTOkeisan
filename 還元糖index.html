<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>還元糖の定量(ベルトラン法)計算</title>
<style>
:root{--bg:#f7f7f4;--card:#fff;--text:#1d1d1b;--sub:#6b6b66;--line:#dcdcd5;--acc:#1f6f5c;--accbg:#e4f2ee;--err:#b3261e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161715;--card:#202220;--text:#ececE8;--sub:#a0a09a;--line:#3a3d3a;--acc:#6fcfb5;--accbg:#1f3a33;--err:#f2b8b5}}
:root[data-theme="dark"]{--bg:#161715;--card:#202220;--text:#ececE8;--sub:#a0a09a;--line:#3a3d3a;--acc:#6fcfb5;--accbg:#1f3a33;--err:#f2b8b5}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.6}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.2rem;margin:0 0 4px}
p.s{color:var(--sub);font-size:.85rem;margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
label{display:block;font-size:.85rem;color:var(--sub);margin-bottom:4px}
input{width:100%;box-sizing:border-box;font-size:1.1rem;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text)}
.main input{font-size:1.4rem}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
details summary{cursor:pointer;color:var(--sub);font-size:.9rem}
.res{background:var(--accbg);border-radius:10px;padding:14px;text-align:center}
.res b{font-size:2rem;color:var(--acc)}
.step{padding:8px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.step:last-child{border:0}
.step small{display:block;color:var(--sub)}
.err{color:var(--err)}
.mono{font-variant-numeric:tabular-nums;overflow-x:auto}
</style>
</head>
<body>
<main>
<h1>還元糖の定量(ベルトラン法)</h1>
<p class="s">過マンガン酸カリウムの滴定量から、試料1gあたりの糖含有量(ブドウ糖)を計算します。</p>

<div class="card main">
<label for="t">KMnO₄ 滴定量(ml)</label>
<input id="t" type="number" inputmode="decimal" step="any" placeholder="例 6.25">
</div>

<div class="card">
<details>
<summary>実験条件(変更可)</summary>
<div class="grid" style="margin-top:12px">
<div><label for="f">ファクター(mgCu/ml)</label><input id="f" type="number" step="any" value="10.06"></div>
<div><label for="w">試料量(g)</label><input id="w" type="number" step="any" value="2"></div>
<div><label for="v">全量(ml)</label><input id="v" type="number" step="any" value="500"></div>
<div><label for="u">使用量(ml)</label><input id="u" type="number" step="any" value="20"></div>
<div><label for="k">でんぷん補正係数</label><input id="k" type="number" step="any" value="0.9"></div>
</div>
</details>
</div>

<div id="out"></div>
</main>
<script>
// ベルトラン糖類定量表(ブドウ糖): 糖量10〜100 mg に相当する銅量(mg)
var CU=[20.4,22.4,24.3,26.3,28.3,30.2,32.2,34.2,36.2,38.1,
40.1,42.0,43.9,45.8,47.7,49.6,51.5,53.4,55.3,57.2,
59.1,60.9,62.8,64.6,66.5,68.3,70.1,72.0,73.8,75.7,
77.5,79.3,81.1,82.9,84.7,86.4,88.2,90.0,91.8,93.6,
95.4,97.1,98.9,100.6,102.3,104.1,105.8,107.6,109.3,111.1,
112.8,114.5,116.2,117.9,119.6,121.3,123.0,124.7,126.4,128.1,
129.8,131.4,133.1,134.7,136.3,137.9,139.6,141.2,142.8,144.5,
146.1,147.7,149.3,150.9,152.5,154.0,155.6,157.2,158.8,160.4,
162.0,163.6,165.2,166.7,168.3,169.9,171.5,173.1,174.6,176.2,177.8];
var $=function(i){return document.getElementById(i)};
function n(x,d){return (Math.round(x*Math.pow(10,d))/Math.pow(10,d)).toFixed(d)}
function calc(){
  var t=parseFloat($('t').value),f=parseFloat($('f').value),w=parseFloat($('w').value),
      v=parseFloat($('v').value),u=parseFloat($('u').value),k=parseFloat($('k').value),o=$('out');
  if(isNaN(t)){o.innerHTML='';return}
  if([f,w,v,u,k].some(isNaN)||w<=0||u<=0){o.innerHTML='<div class="card err">実験条件を確認してください。</div>';return}
  var cu=t*f;
  var lo=CU[0],hi=CU[CU.length-1];
  if(cu<lo||cu>=hi){
    o.innerHTML='<div class="card"><div class="step">Cu量 = '+n(t,3)+' × '+f+' = <b>'+n(cu,2)+' mg</b></div><p class="err">Cu量が表の範囲('+lo+'〜'+hi+' mg)の外です。滴定量を確認してください。</p></div>';
    return;
  }
  var i=0;while(CU[i+1]<=cu)i++;
  var c0=CU[i],c1=CU[i+1],g0=10+i;
  var frac=(cu-c0)/(c1-c0);
  var sugar=1*frac+g0;
  var ratio=v/u;
  var per=sugar*ratio/w;
  var res=per*k;
  o.innerHTML=
  '<div class="card"><div class="res">試料1gあたりの糖含有量<br><b>'+n(res,2)+'</b> mg/g<br><span style="font-size:.9rem">('+n(res/10,3)+' g/100g)</span></div></div>'+
  '<div class="card mono"><div style="font-weight:600;margin-bottom:4px">計算過程</div>'+
  '<div class="step">① Cu量<small>'+n(t,3)+' × '+f+' = <b>'+n(cu,3)+' mg</b></small></div>'+
  '<div class="step">② 表から補間(ブドウ糖)<small>'+g0+' mg → Cu '+c0+' mg<br>'+(g0+1)+' mg → Cu '+c1+' mg</small></div>'+
  '<div class="step">③ 糖量(試料20ml中)<small>1 × (('+n(cu,3)+' − '+c0+') / ('+c1+' − '+c0+')) + '+g0+'<br>= 1 × '+n(frac,4)+' + '+g0+' = <b>'+n(sugar,3)+' mg</b></small></div>'+
  '<div class="step">④ 全量・試料量に換算<small>'+n(sugar,3)+' × ('+v+' / '+u+') ÷ '+w+' = <b>'+n(per,3)+' mg/g</b></small></div>'+
  '<div class="step">⑤ でんぷん補正<small>'+n(per,3)+' × '+k+' = <b>'+n(res,3)+' mg/g</b></small></div></div>';
}
['t','f','w','v','u','k'].forEach(function(id){$(id).addEventListener('input',calc)});
</script>
</body>
</html>
